[project]
name = "dashwidgets"
version = "1.0.0"
description = "Windows桌面小组件管理器 - PySide6 + Fluent Design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Fluent-Widgets>=1.7.5",
    "loguru>=0.7.3",
    "psutil>=5.9.0",
    "feedparser>=6.0.0",
    "pynput>=1.7.6",
]

[project.scripts]
dashwidgets = "main:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
